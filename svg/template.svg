<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="600" height="800" viewBox="0 0 600 800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Kindle Basic dashboard, 600 x 800.
       Time, weather now, Caltrain at Menlo Park both directions, 3 day forecast.
       Placeholders are {{TOKENS}}, filled by bin/run.py.
       Grayscale only: black, #666 secondary, #D0D0D0 track, white paper. -->

  <defs>
    <symbol id="icon-none" viewBox="0 0 24 24"></symbol>

    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5.4" fill="#000"/>
      <g stroke="#000" stroke-width="2.2" stroke-linecap="round">
        <line x1="12" y1="1.2" x2="12" y2="4"/>
        <line x1="12" y1="20" x2="12" y2="22.8"/>
        <line x1="1.2" y1="12" x2="4" y2="12"/>
        <line x1="20" y1="12" x2="22.8" y2="12"/>
        <line x1="4.4" y1="4.4" x2="6.4" y2="6.4"/>
        <line x1="17.6" y1="17.6" x2="19.6" y2="19.6"/>
        <line x1="4.4" y1="19.6" x2="6.4" y2="17.6"/>
        <line x1="17.6" y1="6.4" x2="19.6" y2="4.4"/>
      </g>
    </symbol>

    <symbol id="icon-partly" viewBox="0 0 24 24">
      <circle cx="8.5" cy="8" r="4.2" fill="#000"/>
      <g stroke="#000" stroke-width="2" stroke-linecap="round">
        <line x1="8.5" y1="0.8" x2="8.5" y2="2.6"/>
        <line x1="1.3" y1="8" x2="3.1" y2="8"/>
        <line x1="3.4" y1="2.9" x2="4.7" y2="4.2"/>
      </g>
      <path d="M8 21.5a4.3 4.3 0 0 1 0-8.6 5.6 5.6 0 0 1 10.6-1.3 3.9 3.9 0 0 1 0.4 7.7 4 4 0 0 1-0.6 0.2z" fill="#000"/>
    </symbol>

    <symbol id="icon-cloud" viewBox="0 0 24 24">
      <path d="M7 20.5a4.8 4.8 0 0 1 0-9.6 6.2 6.2 0 0 1 11.8-1.4 4.3 4.3 0 0 1 0.4 8.6 4.4 4.4 0 0 1-0.7 0.2z" fill="#000"/>
    </symbol>

    <symbol id="icon-rain" viewBox="0 0 24 24">
      <path d="M7 16.5a4.4 4.4 0 0 1 0-8.8 5.7 5.7 0 0 1 10.8-1.3 3.9 3.9 0 0 1 0.4 7.9 4 4 0 0 1-0.6 0.2z" fill="#000"/>
      <g stroke="#000" stroke-width="2.4" stroke-linecap="round">
        <line x1="7.5" y1="18.5" x2="6" y2="22.4"/>
        <line x1="12.5" y1="18.5" x2="11" y2="22.4"/>
        <line x1="17.5" y1="18.5" x2="16" y2="22.4"/>
      </g>
    </symbol>

    <symbol id="icon-snow" viewBox="0 0 24 24">
      <path d="M7 16.5a4.4 4.4 0 0 1 0-8.8 5.7 5.7 0 0 1 10.8-1.3 3.9 3.9 0 0 1 0.4 7.9 4 4 0 0 1-0.6 0.2z" fill="#000"/>
      <g fill="#000">
        <circle cx="7" cy="20.6" r="1.7"/>
        <circle cx="12" cy="20.6" r="1.7"/>
        <circle cx="17" cy="20.6" r="1.7"/>
      </g>
    </symbol>

    <symbol id="icon-fog" viewBox="0 0 24 24">
      <path d="M7 13.5a4.4 4.4 0 0 1 0-8.8 5.7 5.7 0 0 1 10.8-1.3 3.9 3.9 0 0 1 0.4 7.9 4 4 0 0 1-0.6 0.2z" fill="#000"/>
      <g stroke="#000" stroke-width="2.4" stroke-linecap="round">
        <line x1="3.5" y1="17" x2="20.5" y2="17"/>
        <line x1="6" y1="21" x2="18" y2="21"/>
      </g>
    </symbol>

    <symbol id="icon-storm" viewBox="0 0 24 24">
      <path d="M7 15a4.4 4.4 0 0 1 0-8.8 5.7 5.7 0 0 1 10.8-1.3 3.9 3.9 0 0 1 0.4 7.9 4 4 0 0 1-0.6 0.2z" fill="#000"/>
      <polygon points="13.4,15 8,23.4 11.4,18.4 8.6,18.4 13.6,11.6 11.4,16.4" fill="#000"/>
    </symbol>
  </defs>

  <rect width="600" height="800" fill="#FFFFFF"/>

  <g font-family="sans-serif">

    <!-- time and date. The time is when this screen was drawn. -->
    <text x="28" y="124" font-size="96" font-weight="700" fill="#000">{{TIME}}<tspan dx="10" font-size="30" fill="#666">{{AMPM}}</tspan></text>
    <text x="568" y="84" font-size="22" font-weight="700" letter-spacing="2" fill="#000" text-anchor="end">{{DAY}}</text>
    <text x="568" y="120" font-size="22" letter-spacing="2" fill="#666" text-anchor="end">{{DATE}}</text>
    <rect x="32" y="148" width="536" height="5" fill="#000"/>

    <!-- weather now -->
    <use xlink:href="#{{ICON}}" x="32" y="180" width="96" height="96"/>
    <text x="146" y="268" font-size="{{TEMP_SIZE}}" font-weight="700" fill="#000">{{TEMP}}</text>
    <text x="568" y="214" font-size="24" fill="#000" text-anchor="end">{{CONDITION}}</text>
    <text x="568" y="250" font-size="24" fill="#666" text-anchor="end">{{RAIN}}</text>

    <!-- today's range: where the current reading sits between low and high -->
    <rect x="32" y="296" width="536" height="14" fill="#D0D0D0"/>
    <rect x="{{MARKER_X}}" y="287" width="8" height="32" fill="#000"/>
    <text x="32" y="336" font-size="22" font-weight="700" fill="#000">{{LOW}}</text>
    <text x="300" y="334" font-size="15" font-weight="700" letter-spacing="3" fill="#666" text-anchor="middle">TODAY</text>
    <text x="568" y="336" font-size="22" font-weight="700" fill="#000" text-anchor="end">{{HIGH}}</text>

    <rect x="32" y="352" width="536" height="3" fill="#000"/>

    <!-- Caltrain, Menlo Park -->
    <rect x="299" y="372" width="2" height="236" fill="#C8C8C8"/>

    <text x="32" y="392" font-size="20" font-weight="700" letter-spacing="3" fill="#000">NORTHBOUND</text>
    <text x="32" y="418" font-size="19" fill="#666">to San Francisco</text>
    <text x="32" y="480" font-size="54" font-weight="700" fill="#000">{{N1_TIME}}</text>
    <text x="32" y="508" font-size="18" fill="{{N1_FILL}}">{{N1_META}}</text>
    <text x="32" y="568" font-size="54" font-weight="700" fill="#000">{{N2_TIME}}</text>
    <text x="32" y="596" font-size="18" fill="{{N2_FILL}}">{{N2_META}}</text>

    <text x="318" y="392" font-size="20" font-weight="700" letter-spacing="3" fill="#000">SOUTHBOUND</text>
    <text x="318" y="418" font-size="19" fill="#666">to San Jose</text>
    <text x="318" y="480" font-size="54" font-weight="700" fill="#000">{{S1_TIME}}</text>
    <text x="318" y="508" font-size="18" fill="{{S1_FILL}}">{{S1_META}}</text>
    <text x="318" y="568" font-size="54" font-weight="700" fill="#000">{{S2_TIME}}</text>
    <text x="318" y="596" font-size="18" fill="{{S2_FILL}}">{{S2_META}}</text>

    <rect x="32" y="626" width="536" height="3" fill="#000"/>

    <!-- next three days -->
    <text x="121" y="666" font-size="22" font-weight="700" letter-spacing="3" fill="#000" text-anchor="middle">{{D1_DAY}}</text>
    <use xlink:href="#{{D1_ICON}}" x="99" y="678" width="44" height="44"/>
    <text x="117" y="756" font-size="24" font-weight="700" fill="#000" text-anchor="end">{{D1_HI}}</text>
    <text x="125" y="756" font-size="24" fill="#666">{{D1_LO}}</text>

    <text x="300" y="666" font-size="22" font-weight="700" letter-spacing="3" fill="#000" text-anchor="middle">{{D2_DAY}}</text>
    <use xlink:href="#{{D2_ICON}}" x="278" y="678" width="44" height="44"/>
    <text x="296" y="756" font-size="24" font-weight="700" fill="#000" text-anchor="end">{{D2_HI}}</text>
    <text x="304" y="756" font-size="24" fill="#666">{{D2_LO}}</text>

    <text x="479" y="666" font-size="22" font-weight="700" letter-spacing="3" fill="#000" text-anchor="middle">{{D3_DAY}}</text>
    <use xlink:href="#{{D3_ICON}}" x="457" y="678" width="44" height="44"/>
    <text x="475" y="756" font-size="24" font-weight="700" fill="#000" text-anchor="end">{{D3_HI}}</text>
    <text x="483" y="756" font-size="24" fill="#666">{{D3_LO}}</text>

    <!-- footer -->
    <text x="32" y="788" font-size="15" letter-spacing="2" fill="#666">{{BATTERY}}</text>
    <text x="568" y="788" font-size="15" letter-spacing="2" fill="#666" text-anchor="end">{{NEXT}}</text>
  </g>
</svg>
