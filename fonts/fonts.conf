<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig for the Kindle.
     Only scan /mnt/us/fonts, where the two DejaVu files live. Scanning the
     stock font folder costs minutes on this CPU and we use none of it.
     The cache lives on the user partition so it survives reboots;
     /var/tmp is wiped on every restart. -->
<fontconfig>
  <dir>/mnt/us/fonts</dir>
  <cachedir>/mnt/us/extensions/dashboard/fonts/cache</cachedir>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
